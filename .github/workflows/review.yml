name: AI Code Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: review
        uses: ./.github/actions/ai-reviewer
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Post review comment
        if: github.event_name == 'pull_request' && steps.review.outputs.verdict != 'skip'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_JSON: ${{ steps.review.outputs.review-json }}
        with:
          script: |
            const marker = "<!-- ai-code-review -->";
            const review = JSON.parse(process.env.REVIEW_JSON);
            const pass = review.verdict === "pass";

            const body = [
              marker,
              "## AI Code Review",
              "",
              `**Verdict:** ${pass ? "pass" : "fail"}`,
              "",
              "| Criterion | Score |",
              "| --- | ---: |",
              `| Island Contract | ${review.islandContract}/10 |`,
              `| Tailwind Conventions | ${review.tailwindConventions}/10 |`,
              `| Supabase Security | ${review.supabaseSecurity}/10 |`,
              `| Test Coverage | ${review.testCoverage}/10 |`,
              `| Worker Compatibility | ${review.workerCompatibility}/10 |`,
              "",
              review.summary,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce verdict
        if: steps.review.outputs.verdict != 'skip'
        run: |
          if [ "${{ steps.review.outputs.verdict }}" = "fail" ]; then
            exit 1
          fi
